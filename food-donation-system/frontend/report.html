<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Analytics | Food Donation Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Premium Dark Blue Theme */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a192f; /* Deep Navy Background */
            color: #cbd5e1;
        }
        
        .chart-container { 
            position: relative; 
            min-height: 320px; 
            width: 100%; 
        }

        /* Custom Entrance Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-up {
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* Custom Scrollbar matching the dark blue theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a192f; }
        ::-webkit-scrollbar-thumb { background: #233554; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 lg:p-12 selection:bg-emerald-400 selection:text-slate-900">

    <div class="max-w-7xl mx-auto">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 gap-6 animate-slide-up">
            <div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white flex items-center gap-4">
                    <span class="relative flex h-5 w-5 mt-1">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-5 w-5 bg-red-500 border-2 border-[#0a192f] shadow-sm"></span>
                    </span>
                    Live Analytics & Reports
                </h1>
                <p class="text-slate-400 mt-2 font-medium ml-9">Real-time system insights updated every 30 seconds.</p>
            </div>
            
            <button onclick="window.location.href='dashboard.html'" class="px-6 py-3 bg-[#112240] border border-[#233554] rounded-xl text-slate-300 hover:bg-[#1d3354] hover:text-emerald-400 hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300 font-bold shadow-sm flex items-center gap-2 active:scale-95">
                <span class="text-xl leading-none">←</span> Back to Dashboard
            </button>
        </header>

        <div class="bg-[#112240] p-4 sm:p-6 rounded-3xl shadow-lg border border-[#233554] mb-8 flex flex-col md:flex-row gap-4 items-center animate-slide-up delay-1">
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="p-3 bg-[#0a192f] rounded-xl text-xl border border-[#233554]">🎛️</div>
                <div class="flex-1 md:w-64">
                    <label for="roleFilter" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Filter by User Role</label>
                    <div class="relative">
                        <select id="roleFilter" class="appearance-none w-full bg-[#0a192f] border border-[#233554] text-slate-200 font-bold py-3 px-4 pr-10 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all cursor-pointer">
                            <option value="All">All Users</option>
                            <option value="Donors">💖 Donors Only</option>
                            <option value="NGOs">🏢 NGOs Only</option>
                            <option value="Organizations">🏬 Organizations Only</option>
                            <option value="Standard Users">👤 Standard Users Only</option>
                            <option value="Admins">🛡️ Admins Only</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-xs font-semibold text-slate-400 md:ml-auto bg-[#0a192f] px-4 py-2 rounded-full border border-[#233554] shadow-inner">
                System Online <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block ml-1 animate-pulse"></span>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div class="bg-[#112240] p-6 sm:p-8 rounded-3xl shadow-lg hover:shadow-xl hover:-translate-y-2 border border-[#233554] flex items-center gap-6 transition-all duration-300 animate-slide-up delay-1 group cursor-default relative overflow-hidden">
                <div class="w-16 h-16 rounded-2xl bg-[#0a192f] flex items-center justify-center text-3xl text-indigo-400 group-hover:scale-110 transition-transform border border-[#233554] relative z-10">👥</div>
                <div class="relative z-10">
                    <p class="text-xs font-bold text-slate-400 mb-1 uppercase tracking-widest">Total Users</p>
                    <h2 class="text-5xl font-extrabold text-white tracking-tight" id="totalUsers">0</h2>
                </div>
            </div>
            
            <div class="bg-[#112240] p-6 sm:p-8 rounded-3xl shadow-lg hover:shadow-xl hover:-translate-y-2 border border-[#233554] flex items-center gap-6 transition-all duration-300 animate-slide-up delay-2 group cursor-default relative overflow-hidden">
                <div class="w-16 h-16 rounded-2xl bg-[#0a192f] flex items-center justify-center text-3xl text-amber-400 group-hover:scale-110 transition-transform border border-[#233554] relative z-10">🍲</div>
                <div class="relative z-10">
                    <p class="text-xs font-bold text-slate-400 mb-1 uppercase tracking-widest">Total Donations</p>
                    <h2 class="text-5xl font-extrabold text-white tracking-tight" id="totalDonations">0</h2>
                </div>
            </div>
            
            <div class="bg-[#112240] p-6 sm:p-8 rounded-3xl shadow-lg hover:shadow-xl hover:-translate-y-2 border border-[#233554] flex items-center gap-6 transition-all duration-300 animate-slide-up delay-3 group cursor-default overflow-hidden relative">
                <div class="absolute -right-4 -bottom-4 opacity-5 text-9xl z-0 pointer-events-none">✨</div>
                <div class="w-16 h-16 rounded-2xl bg-[#0a192f] flex items-center justify-center text-3xl text-emerald-400 group-hover:scale-110 transition-transform border border-[#233554] relative z-10">✨</div>
                <div class="relative z-10">
                    <p class="text-xs font-bold text-slate-400 mb-1 uppercase tracking-widest">Available Food</p>
                    <h2 class="text-5xl font-extrabold text-emerald-400 tracking-tight drop-shadow-sm" id="availableDonations">0</h2>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">

            <div class="bg-[#112240] p-6 sm:p-8 rounded-3xl shadow-lg hover:shadow-xl transition-shadow border border-[#233554] animate-slide-up delay-2 relative overflow-hidden">
                <div class="flex justify-between items-center mb-6 relative z-10">
                    <h2 class="text-xl font-bold text-white">User Demographics</h2>
                    <span class="p-2 bg-[#0a192f] border border-[#233554] rounded-lg text-slate-400">📊</span>
                </div>
                <div class="chart-container flex justify-center items-center relative z-10">
                    <canvas id="usersChart"></canvas>
                </div>
            </div>

            <div class="bg-[#112240] p-6 sm:p-8 rounded-3xl shadow-lg hover:shadow-xl transition-shadow border border-[#233554] animate-slide-up delay-3 relative overflow-hidden">
                <div class="flex justify-between items-center mb-6 relative z-10">
                    <h2 class="text-xl font-bold text-white">Food Status Breakdown</h2>
                    <span class="p-2 bg-[#0a192f] border border-[#233554] rounded-lg text-slate-400">📈</span>
                </div>
                <div class="chart-container flex justify-center items-center relative z-10">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <div class="bg-[#112240] p-6 sm:p-8 rounded-3xl shadow-lg hover:shadow-xl transition-shadow border border-[#233554] lg:col-span-2 animate-slide-up delay-4 relative overflow-hidden">
                <div class="flex justify-between items-center mb-6 relative z-10">
                    <div>
                        <h2 class="text-xl font-bold text-white">Donation Growth Timeline</h2>
                        <p class="text-sm text-slate-400 font-medium">Real-time network activity stream.</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-1 bg-[#0a192f] border border-[#233554] rounded-full p-1 shadow-inner">
                            <button onclick="switchTimelineMode('testing')" id="btn-mode-testing" class="px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 bg-emerald-500 text-slate-900 shadow-md">Live Stream</button>
                            <button onclick="switchTimelineMode('real')" id="btn-mode-real" class="px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 text-slate-400 hover:text-white">Historical Data</button>
                        </div>
                        <span class="p-2 bg-[#0a192f] border border-[#233554] rounded-lg text-slate-400 hidden sm:block">📉</span>
                    </div>
                </div>
                <div class="chart-container relative z-10">
                    <canvas id="donationTimelineChart"></canvas>
                </div>
            </div>

        </div>
    </div>

<script>
    // Global Settings for Chart.js to match Dark Blue Theme
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = '#94a3b8'; // slate-400

    const USERS_API_URL = 'http://localhost:5000/users';
    const DONATIONS_API_URL = 'http://localhost:5000/donations';

    let allUsers = [];
    let allDonations = [];

    let usersChart = null;
    let statusChart = null;
    let timelineChart = null;

    // Track state for the timeline chart
    let chartMode = 'testing';
    let realTimelineData = null; 
    let waveInterval = null; // Holds the live scrolling animation loop

    // Track current values for the counting animation
    const currentValues = {
        totalUsers: 0,
        totalDonations: 0,
        availableDonations: 0
    };

    const userRoleCategories = ['Donors', 'NGOs', 'Organizations', 'Standard Users', 'Admins', 'Other'];

    function getUserRoleCategory(role) {
        const normalizedRole = String(role || '').trim().toLowerCase();
        if (['donater', 'donor', 'community contributor'].includes(normalizedRole)) return 'Donors';
        if (['ngo', 'ngo partner'].includes(normalizedRole)) return 'NGOs';
        if (normalizedRole === 'organization') return 'Organizations';
        if (['user', 'standard user'].includes(normalizedRole)) return 'Standard Users';
        if (normalizedRole === 'admin') return 'Admins';
        return 'Other';
    }

    // Smooth Number Counter Function
    function animateValue(id, endValue) {
        if (currentValues[id] === endValue) return; 
        
        const element = document.getElementById(id);
        let startValue = currentValues[id];
        let duration = 1200; 
        let startTimestamp = null;

        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            
            const easeProgress = 1 - Math.pow(1 - progress, 4); // Ease out
            
            element.innerHTML = Math.floor(easeProgress * (endValue - startValue) + startValue).toLocaleString();
            
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                element.innerHTML = endValue.toLocaleString(); 
                currentValues[id] = endValue;
            }
        };
        window.requestAnimationFrame(step);
    }

    // Fetch Data
    async function fetchData() {
        try {
            const [usersRes, donationsRes] = await Promise.all([
                fetch(USERS_API_URL),
                fetch(DONATIONS_API_URL)
            ]);

            allUsers = await usersRes.json();
            allDonations = await donationsRes.json();

            updateReport();
        } catch (err) {
            console.error("Error fetching data:", err);
        }
    }

    // Initialize Charts with Dark Theme Colors
    function initCharts() {
        // Users Doughnut Chart
        const ctxUsers = document.getElementById('usersChart').getContext('2d');
        usersChart = new Chart(ctxUsers, {
            type: 'doughnut',
            data: { 
                labels: [], 
                datasets: [{ 
                    data: [], 
                    backgroundColor: ['#10b981', '#f59e0b', '#06b6d4', '#94a3b8', '#6366f1', '#f43f5e'], 
                    borderColor: '#112240', // Match card bg to blend borders
                    borderWidth: 2,
                    hoverOffset: 10 
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                cutout: '75%',
                animation: { animateScale: true, animateRotate: true, duration: 1500 },
                plugins: { 
                    legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true, pointStyle: 'circle' } },
                    tooltip: { backgroundColor: 'rgba(10, 25, 47, 0.95)', padding: 12, cornerRadius: 8, borderColor: '#233554', borderWidth: 1 }
                } 
            }
        });

        // Status Pie Chart
        const ctxStatus = document.getElementById('statusChart').getContext('2d');
        statusChart = new Chart(ctxStatus, {
            type: 'pie',
            data: { 
                labels: [], 
                datasets: [{ 
                    data: [], 
                    backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'], 
                    borderColor: '#112240',
                    borderWidth: 2,
                    hoverOffset: 10 
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                animation: { animateScale: true, animateRotate: true, duration: 1500 }, 
                plugins: { 
                    legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true, pointStyle: 'circle' } },
                    tooltip: { backgroundColor: 'rgba(10, 25, 47, 0.95)', padding: 12, cornerRadius: 8, borderColor: '#233554', borderWidth: 1 }
                } 
            }
        });

        // Initialize Timeline Chart (Empty structure, will be filled immediately by switchTimelineMode)
        const ctxTimeline = document.getElementById('donationTimelineChart').getContext('2d');
        
        let grad1 = ctxTimeline.createLinearGradient(0, 0, 0, 300);
        grad1.addColorStop(0, 'rgba(16, 185, 129, 0.4)'); grad1.addColorStop(1, 'rgba(16, 185, 129, 0.0)');
        
        let grad2 = ctxTimeline.createLinearGradient(0, 0, 0, 300);
        grad2.addColorStop(0, 'rgba(99, 102, 241, 0.4)'); grad2.addColorStop(1, 'rgba(99, 102, 241, 0.0)');
        
        let grad3 = ctxTimeline.createLinearGradient(0, 0, 0, 300);
        grad3.addColorStop(0, 'rgba(6, 182, 212, 0.4)'); grad3.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

        timelineChart = new Chart(ctxTimeline, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [
                    { label: 'Network Requests', data: [], borderColor: '#10b981', backgroundColor: grad1, borderWidth: 2, fill: true, tension: 0.4, pointRadius: 0 },
                    { label: 'Active Transfers', data: [], borderColor: '#6366f1', backgroundColor: grad2, borderWidth: 2, fill: true, tension: 0.4, pointRadius: 0 },
                    { label: 'System Pings', data: [], borderColor: '#06b6d4', backgroundColor: grad3, borderWidth: 2, fill: true, tension: 0.4, pointRadius: 0 }
                ] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, grid: { borderDash: [4, 4], color: '#233554' } },
                    x: { grid: { display: false }, display: false } // Hidden X axis for seamless wave flow
                },
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true, pointStyle: 'circle' } }, 
                    tooltip: { backgroundColor: 'rgba(10, 25, 47, 0.95)', padding: 12, cornerRadius: 8, borderColor: '#233554', borderWidth: 1 }
                }
            }
        });
    }

    // ULTRA-SLOW & SMOOTH SCROLLING WAVE ANIMATION
    function startLiveStream() {
        if (waveInterval) clearInterval(waveInterval);
        
        const maxPoints = 50; // How many points on screen at once
        let waveOffset = 0;   // The time tracker
        
        // SPEED CONTROLS
        const waveSpeed = 0.003; // 95% slower. Controls how fast it scrolls horizontally
        const pointSpacing = 0.2; // Controls how "wavy" it is. Higher = more tight waves.

        // Initialize empty arrays
        const labels = Array(maxPoints).fill('');
        const d1 = Array(maxPoints).fill(0);
        const d2 = Array(maxPoints).fill(0);
        const d3 = Array(maxPoints).fill(0);

        timelineChart.data.labels = labels;
        timelineChart.data.datasets[0].data = d1;
        timelineChart.data.datasets[1].data = d2;
        timelineChart.data.datasets[2].data = d3;
        
        // Settings specific to the live flowing look
        timelineChart.options.animation = false; // Disable Chart.js animation so we can manually draw frames
        timelineChart.options.scales.x.display = false; // Hide X axis
        timelineChart.options.plugins.legend.display = true;
        
        // The Engine: Update the entire array every 50ms for buttery smooth frame rates
        // By using complex trigonometric interference instead of Math.random(), it doesn't jitter!
        waveInterval = setInterval(() => {
            waveOffset += waveSpeed; // Increment time slowly
            
            for (let i = 0; i < maxPoints; i++) {
                // Calculate the spatial position of each point, shifted by time (waveOffset)
                let x = (i * pointSpacing) + waveOffset;
                
                // Pure trigonometric interference creates chaotic but perfectly smooth waves
                d1[i] = 5 * Math.sin(x) + 2 * Math.sin(x * 2.1) + 12;
                d2[i] = 3 * Math.cos(x * 0.8) + 1.5 * Math.sin(x * 1.5) + 7;
                d3[i] = 2 * Math.sin(x * 1.3) + Math.cos(x * 2.7) + 4;
            }

            // Update chart frame WITHOUT default animation so it slides instantly
            timelineChart.update('none');
        }, 50); 
    }

    // Process Data and Update UI
    function updateReport() {
        const userStr = localStorage.getItem("currentUser");
        if (!userStr) return;

        const roleFilter = document.getElementById('roleFilter').value;

        // Filter Users & Update KPIs
        const filteredUsers = roleFilter === "All"
            ? allUsers
            : allUsers.filter(user => getUserRoleCategory(user.role) === roleFilter);
        animateValue('totalUsers', filteredUsers.length);
        animateValue('totalDonations', allDonations.length);
        animateValue('availableDonations', allDonations.filter(d => d.status === "Available").length);

        // Update Users Doughnut
        const roleCounts = Object.fromEntries(userRoleCategories.map(category => [category, 0]));
        filteredUsers.forEach(user => { roleCounts[getUserRoleCategory(user.role)]++; });
        usersChart.data.labels = userRoleCategories;
        usersChart.data.datasets[0].data = userRoleCategories.map(category => roleCounts[category]);
        usersChart.update();

        // Update Status Pie
        const statusCounts = { 'Available': 0, 'Reviewing': 0, 'Reserved': 0, 'Delivered': 0 };
        allDonations.forEach(d => { statusCounts[d.status] = (statusCounts[d.status] || 0) + 1; });
        statusChart.data.labels = Object.keys(statusCounts);
        statusChart.data.datasets[0].data = Object.values(statusCounts);
        statusChart.update();

        // Prepare Real Historical Data Object (always updated in background)
        const timeline = {};
        allDonations.forEach(d => {
            const date = new Date(d.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            timeline[date] = (timeline[date] || 0) + 1;
        });
        const sortedDates = Object.keys(timeline).sort((a,b)=> new Date(a)-new Date(b));
        
        const ctxTimeline = document.getElementById('donationTimelineChart').getContext('2d');
        let gradFillReal = ctxTimeline.createLinearGradient(0, 0, 0, 300);
        gradFillReal.addColorStop(0, 'rgba(16, 185, 129, 0.4)'); 
        gradFillReal.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

        realTimelineData = {
            labels: sortedDates,
            datasets: [{ 
                label: 'Donations Processed (Real Data)', 
                data: sortedDates.map(date => timeline[date]), 
                borderColor: '#10b981', 
                backgroundColor: gradFillReal, 
                borderWidth: 3,
                pointBackgroundColor: '#0a192f',
                pointBorderColor: '#10b981',
                pointBorderWidth: 2,
                pointRadius: 5, 
                pointHoverRadius: 7,
                fill: true, 
                tension: 0.4 
            }]
        };

        // If user is actively looking at Real data, update it.
        if (chartMode === 'real') {
            applyRealDataConfig();
        }
    }

    function applyRealDataConfig() {
        if (!realTimelineData) return;
        timelineChart.data = realTimelineData;
        timelineChart.options.scales.x.display = true; // Show dates on X axis
        timelineChart.options.plugins.legend.display = false; // Hide legend for single line
        timelineChart.options.animation = { duration: 1000, easing: 'easeOutQuart' }; // Turn Chart.js animation back on
        timelineChart.update();
    }

    // Mode Switcher (Live Stream vs Historical)
    function switchTimelineMode(mode) {
        chartMode = mode;
        
        const testingBtn = document.getElementById('btn-mode-testing');
        const realBtn = document.getElementById('btn-mode-real');

        if (mode === 'testing') {
            // Update Buttons
            testingBtn.className = "px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 bg-emerald-500 text-slate-900 shadow-md";
            realBtn.className = "px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 text-slate-400 hover:text-white";
            // Start Animation
            startLiveStream();
        } else {
            // Update Buttons
            realBtn.className = "px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 bg-emerald-500 text-slate-900 shadow-md";
            testingBtn.className = "px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 text-slate-400 hover:text-white";
            // Stop animation & load real data
            if (waveInterval) clearInterval(waveInterval);
            applyRealDataConfig();
        }
    }

    // Event Listener for the Filter Dropdown
    document.getElementById('roleFilter').addEventListener('change', updateReport);

    // Initial Startup
    window.onload = () => {
        const userStr = localStorage.getItem("currentUser");
        if (!userStr) {
            window.location.replace("index.html");
            return;
        }

        initCharts();
        fetchData();
        switchTimelineMode('testing'); // Kick off the live wave animation by default
        
        setInterval(fetchData, 30000); // Live Background Refresh every 30s
    };
</script>

</body>
</html>
